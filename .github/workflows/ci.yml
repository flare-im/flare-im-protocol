name: Protobuf compatibility

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protobuf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: bufbuild/setup-action@v1
        with:
          version: '1.61.0'
      - run: buf build
      - name: Check compatibility with the previous schema
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "$BASE" || "$BASE" == 0000000000000000000000000000000000000000 ]]; then
            BASE=2.1.0
          fi
          before=$(mktemp -d)
          git archive "$BASE" proto | tar -x -C "$before"
          buf breaking --against "$before/proto"
