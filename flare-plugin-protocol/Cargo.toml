[package]
name = "flare-plugin-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
license = "Apache-2.0"
description = "Business-neutral Flare plugin manifests, registry, grants and lifecycle contracts"
repository = "https://github.com/flare-im/flare-protocol"

[features]
# Reading and writing web bundle archives (`bundle::check_archive`,
# `unpack_archive`, `write_archive`): the platform, the CLI and native
# engines; the browser engine reads unpacked files and leaves it off.
bundle-archive = []

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
schemars = "1.2.1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
# Packages are written and read as stored entries: no compression feature.
zip = { version = "9.4", default-features = false }

